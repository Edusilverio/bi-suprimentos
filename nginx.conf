# nginx para SPA (react-router): Cloud Run exige escutar na 8080.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback: qualquer rota desconhecida devolve o index.html
    # (o react-router resolve a rota no cliente). Sem isso, dar F5 em
    # /indicadores-sustentabilidade retornaria 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Assets com hash no nome -> cache longo e imutavel
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
}
